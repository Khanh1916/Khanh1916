name: test

# Offline checks for the profile generator: every SVG renders in both themes,
# the README still lines up with the script, and the API helpers behave.
# No token, no network. Separate from rescan so a failing check never blocks a refresh.
on:
  push:
    paths:
      - scripts/**
      - tests/**
      - README.md
      - profile.json
      - .github/workflows/test.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: python3 -B -m unittest discover -s tests -v
